name: saas-radar pipeline

"on":
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Forzar modo CARGA COMPLETA (365d)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: 'saas-radar'
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      AI_PROVIDER: ${{ secrets.AI_PROVIDER }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout data branch into persist/
        id: checkout_data
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: data
          path: persist
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create data branch if it does not exist
        if: steps.checkout_data.outcome == 'failure'
        run: |
          mkdir -p persist/data/runs
          cd persist
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git checkout --orphan data
          git commit --allow-empty -m "chore: init data branch"
          git push origin data

      - name: Restore saas.db from persist/
        run: |
          mkdir -p data/runs
          if [ -f persist/data/saas.db ]; then
            cp persist/data/saas.db data/saas.db
            echo "Restored data/saas.db from persist/ ($(du -sh data/saas.db | cut -f1))"
          else
            echo "No prior saas.db found — starting fresh"
          fi

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Download NLTK stopwords
        run: python -c "import nltk; nltk.download('stopwords', quiet=True)"

      - name: Run pipeline
        run: |
          if [ "${{ github.event.inputs.full_scan }}" = "true" ]; then
            python -m saas_radar.main --full-scan
          else
            python -m saas_radar.main
          fi

      - name: Copy outputs to persist/
        run: |
          mkdir -p persist/data/runs
          cp data/saas.db persist/data/saas.db
          if ls data/runs/*.json 2>/dev/null | head -1 > /dev/null; then
            cp data/runs/*.json persist/data/runs/ 2>/dev/null || true
          fi

      - name: Commit and push to data branch
        run: |
          cd persist
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: pipeline run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin data
          else
            echo "No changes to commit"
          fi
