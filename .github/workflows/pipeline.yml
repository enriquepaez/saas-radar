name: saas-radar pipeline

"on":
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Forzar modo CARGA COMPLETA (365d)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: 'saas-radar'
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
      EXTRACTION_PROVIDER: ${{ secrets.EXTRACTION_PROVIDER }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Restore saas.db from cache
        uses: actions/cache@v4
        with:
          path: data/saas.db
          key: saas-db-${{ github.run_id }}
          restore-keys: saas-db-

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Download NLTK stopwords
        run: python -c "import nltk; nltk.download('stopwords', quiet=True)"

      - name: Prepare data directories
        run: mkdir -p data/runs

      - name: Run pipeline
        run: |
          if [ "${{ github.event.inputs.full_scan }}" = "true" ]; then
            python -m saas_radar.main --full-scan
          else
            python -m saas_radar.main
          fi

      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-outputs-${{ github.run_id }}
          path: data/runs/
          retention-days: 30
          if-no-files-found: ignore
