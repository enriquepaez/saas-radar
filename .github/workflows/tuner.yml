name: saas-radar tuner

on:
  workflow_run:
    workflows: ["saas-radar pipeline"]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: saas-radar-tuner
  cancel-in-progress: false

jobs:
  tune:
    # Solo si el pipeline que disparo termino en exito (o si es disparo manual).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      # Fallback de transición: la BD vive ahora en GitHub Releases y la rama
      # data ya no se escribe. continue-on-error permite que la transición sea
      # limpia cuando la rama data se borre. Se eliminará junto con la rama
      # tras verificar varios runs verdes.
      - name: Checkout data branch (fallback transitorio)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: data
          path: persist
          fetch-depth: 1

      - name: Restore saas.db from release or data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p persist/data/runs
          if [ ! -f persist/data/saas.db ]; then
            if gh release download db-latest --pattern 'saas.db.zst' --output persist/data/saas.db.zst --clobber; then
              zstd -d -f persist/data/saas.db.zst -o persist/data/saas.db
            elif [ -f persist/data/saas.db.zst ]; then
              zstd -d -f persist/data/saas.db.zst -o persist/data/saas.db
            else
              echo "Sin release db-latest ni rama data: el tuner correra sin BD previa."
            fi
          fi
          # Los meta-JSON de runs viven en runs.tar.gz (release db-latest); sin
          # ellos el tuner analiza 0 runs y las reglas basadas en historico no ven nada.
          if gh release download db-latest --pattern 'runs.tar.gz' --output runs.tar.gz --clobber; then
            tar -xzf runs.tar.gz -C persist
            rm -f runs.tar.gz
          else
            echo "Sin runs.tar.gz en db-latest: el tuner correra solo con la BD."
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Download NLTK stopwords
        run: python -c "import nltk; nltk.download('stopwords', quiet=True)"

      - name: Check Telegram secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN o TELEGRAM_CHAT_ID no configurados en Secrets."
            exit 1
          fi

      - name: Run tuner (dry-run)
        run: |
          python -m saas_radar.agents.tuner \
            --runs-dir persist/data/runs \
            --db-path persist/data/saas.db \
            --lookback 10 \
            --max-changes 5 \
            --show-diff \
            | tee tuner_report.txt

      - name: Upload tuner report artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuner-report-${{ github.run_id }}
          path: tuner_report.txt
          retention-days: 30

      - name: Send Telegram report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m saas_radar.notifications.telegram tuner-report tuner_report.txt

      # Sin identidad git el `git commit` del modo --apply falla con
      # "fatal: empty ident name" (causa del run rojo del 2026-07-06).
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run tuner (apply PR)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m saas_radar.agents.tuner \
            --runs-dir persist/data/runs \
            --db-path persist/data/saas.db \
            --lookback 10 \
            --max-changes 5 \
            --apply \
            --readme-path README.md

      - name: Notify failure via Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -sS --max-time 15 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=[ALERTA] Workflow 'saas-radar tuner' ha fallado. Run: ${RUN_URL}" \
              || true
          else
            echo "Secrets de Telegram no configurados; alerta omitida."
          fi
